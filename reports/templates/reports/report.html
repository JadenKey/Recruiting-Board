{% extends 'base.html' %}
{% block content %}
<div class="p-3 mt-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card rb-card-background shadow p-3 mb-4 rounded">
          <div class="card-body">
            <h2>{{ template_data.title }}</h2>
            <p class="text-muted">{{ template_data.subtitle }}</p>
            <hr />
            <form method="POST">
              {% csrf_token %}
              {{ template_data.form.as_p }}
              <button type="submit"
                class="btn btn-rb px-4 py-2 fw-semibold">Submit Report
              </button>
              <a href="{% url 'home.index' %}"
                class="btn btn-rb-secondary px-4 py-2 fw-semibold">Cancel</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
