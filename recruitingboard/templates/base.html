<!DOCTYPE html>
<html>
  {% load static %}
  <head>
    <title>{{ template_data.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <nav class="p-3 navbar navbar-dark bg-dark navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home.index' %}">Recruiting Board</a>
      
          <button class="navbar-toggler" type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarNavAltMarkup"
                  aria-controls="navbarNavAltMarkup"
                  aria-expanded="false"
                  aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse"
              id="navbarNavAltMarkup">
            <div class="navbar-nav ms-auto navbar-ml">
              <a class="nav-link"
                href="{% url 'home.index' %}">About</a>
              <a class="nav-link"
                href="{% url 'jobs.search' %}">Find Jobs</a>
              {% if user.is_authenticated %}
                {% if user.is_recruiter %}
                  <a class="nav-link"
                    href="{% url 'jobs.index' %}">Jobs</a>
                {% endif %}
                <a class="nav-link"
                  href="{% url 'login' %}">Log Out</a>
              {% else %}
                <a class="nav-link"
                  href="{% url 'login' %}">Log In</a>
                <a class="nav-link"
                  href="{% url 'accounts.signup' %}">Sign Up</a>
              {% endif %}
            </div>
          </div>
      </div>
    </nav>
    <div>
      {% block content %}
      {% endblock content %}
    </div>
    
  </body>
</html>
