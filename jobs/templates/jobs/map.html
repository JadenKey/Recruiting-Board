
{% extends 'base.html' %}
{% block content %}
<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.css"
/>
<style>
  #job-map {
    height: 550px;
    width: 100%;
    border-radius: 8px;
  }
  .rb-job-marker {
    width: 34px;
    height: 34px;
    background-color: #9c7032;
    color: white;
    border: 2px solid #543d2f;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
  }
  .rb-job-popup {
    color: #543d2f;
    font-family: 'Poppins', sans-serif;
    padding: 8px;
  }
  .rb-job-popup strong {
    display: block;
    font-size: 15px;
    margin-bottom: 5px;
  }
  .rb-job-popup p {
    margin-bottom: 4px;
    font-size: 13px;
  }
  .rb-job-popup a {
    color: #9c7032;
    font-weight: 600;
    text-decoration: underline;
  }
  .rb-job-popup + .rb-job-popup {
    border-top: 1px solid #d4b89d;
  }
</style>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2>Job Map</h2>
      <p class="text-muted">
        Explore available job opportunities on the map.
      </p>
    </div>
    <a href="{% url 'jobs.search' %}"
      class="btn btn-rb-secondary px-4 py-2 fw-semibold">
      Back to Jobs
    </a>
  </div>
  <hr />

  <div class="card rb-card-background shadow rounded p-3 mb-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label for="distance-filter" class="form-label fw-semibold">
          Distance from My Location
        </label>
        <select id="distance-filter" class="form-select" disabled>
          <option value="10">Within 10 miles</option>
          <option value="25" selected>Within 25 miles</option>
          <option value="50">Within 50 miles</option>
          <option value="100">Within 100 miles</option>
          <option value="250">Within 250 miles</option>
          <option value="all">Any distance</option>
        </select>
      </div>

      <div class="col-md-7 d-flex gap-2 flex-wrap">
        <button id="use-location" type="button"
                class="btn btn-rb px-4 py-2 fw-semibold">
          Use My Location
        </button>

        <button id="show-all-jobs" type="button"
                class="btn btn-rb-secondary px-4 py-2 fw-semibold"
                disabled>
          Show All Jobs
        </button>
      </div>
    </div>

    <p id="filter-status" class="small mt-3 mb-0"
      role="status" aria-live="polite">
      Use your current location to find nearby jobs.
    </p>
  </div>

  <div class="card rb-card-background shadow rounded p-3">
    <div id="job-map"></div>
    <p class="small mt-3 mb-0">
      Click a marker to view the job details.
    </p>
  </div>
</div>
{{ template_data.job_locations|json_script:"job-data" }}

<!-- interactive map based on https://openfreemap.org/quick_start/ -->
<!-- MapLibre documentation: https://maplibre.org/maplibre-gl-js/docs/ -->
<script type="module">
  import * as maplibregl from
    "https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.mjs";

  const jobs = JSON.parse(
    document.getElementById("job-data").textContent
  );

  const map = new maplibregl.Map({
    container: "job-map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [-98.5795, 39.8283],
    zoom: 4
  });

  map.addControl(
    new maplibregl.NavigationControl(),
    "top-left"
  );
  const locationControl = new maplibregl.GeolocateControl({
    positionOptions: {
      enableHighAccuracy: true
    },
    trackUserLocation: false,
    showUserLocation: true
  });

  map.addControl(locationControl, "top-left");

  const bounds = new maplibregl.LngLatBounds();
  const groups = new Map();
  const jobMarkers = [];

  jobs.forEach(job => {
    const key = `${job.latitude},${job.longitude}`;
    if (!groups.has(key)) {
      groups.set(key, []);
    }
    groups.get(key).push(job);
  });

  groups.forEach(group => {
    const first = group[0];
    const coords = [
      first.longitude,
      first.latitude
    ];

    const markerElement = document.createElement("div");
    markerElement.className = "rb-job-marker";

    const icon = document.createElement("i");
    icon.className = "fa-solid fa-briefcase";
    markerElement.appendChild(icon);

    const popup = document.createElement("div");

    group.forEach(job => {
      const item = document.createElement("div");
      item.className = "rb-job-popup";

      const title = document.createElement("strong");
      title.textContent = job.title;

      const company = document.createElement("p");
      company.textContent = job.company;

      const location = document.createElement("p");
      location.textContent = job.location;

      const link = document.createElement("a");
      link.href = "{% url 'jobs.search' %}#job-" + job.id;
      link.textContent = "View Job Posting";

      item.append(title, company, location, link);
      popup.appendChild(item);
    });

    const marker = new maplibregl.Marker({
      element: markerElement,
      anchor: "bottom"
    })
      .setLngLat(coords)
      .setPopup(
        new maplibregl.Popup({
          offset: 25,
          maxWidth: "300px"
        }).setDOMContent(popup)
      )
      .addTo(map);

    jobMarkers.push({
      marker: marker,
      latitude: first.latitude,
      longitude: first.longitude,
      count: group.length
    });

    bounds.extend(coords);
  });

  if (jobs.length > 0) {
    map.fitBounds(bounds, {
      padding: 40,
      maxZoom: 12
    });
  }

  const distanceFilter = document.getElementById("distance-filter");
  const locationButton = document.getElementById("use-location");
  const showAllButton = document.getElementById("show-all-jobs");
  const filterStatus = document.getElementById("filter-status");

  let userLocation = null;

  // formula used to calculate distance between two coordinates
  // adapted from https://www.movable-type.co.uk/scripts/latlong.html
  function calculateDistance(lat1, lon1, lat2, lon2) {
    const earthRadius = 3958.8;
    const toRadians = Math.PI / 180;

    const deltaLat = (lat2 - lat1) * toRadians;
    const deltaLon = (lon2 - lon1) * toRadians;

    const a =
      Math.sin(deltaLat / 2) ** 2 +
      Math.cos(lat1 * toRadians) *
      Math.cos(lat2 * toRadians) *
      Math.sin(deltaLon / 2) ** 2;

    return 2 * earthRadius *
      Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0, 1 - a)));
  }

  function filterJobsByDistance() {
    if (!userLocation) {
      jobMarkers.forEach(job => {
        job.marker.getElement().style.display = "";
      });
      return;
    }

    const selectedDistance = distanceFilter.value;

    const maxDistance = selectedDistance === "all"
      ? Infinity
      : Number(selectedDistance);

    const visibleBounds = new maplibregl.LngLatBounds();
    let visibleJobCount = 0;

    if (maxDistance !== Infinity) {
      visibleBounds.extend([
        userLocation.longitude,
        userLocation.latitude
      ]);
    }

    jobMarkers.forEach(job => {
      const distance = calculateDistance(
        userLocation.latitude,
        userLocation.longitude,
        job.latitude,
        job.longitude
      );

      const isVisible = distance <= maxDistance;

      job.marker.getElement().style.display =
        isVisible ? "" : "none";

      if (isVisible) {
        visibleJobCount += job.count;

        visibleBounds.extend([
          job.longitude,
          job.latitude
        ]);
      } else {
        job.marker.getPopup()?.remove();
      }
    });

    if (!visibleBounds.isEmpty()) {
      map.fitBounds(visibleBounds, {
        padding: 40,
        maxZoom: 12
      });
    }

    if (maxDistance === Infinity) {
      filterStatus.textContent =
        `Showing all ${visibleJobCount} mapped jobs.`;
    } else if (visibleJobCount === 0) {
      filterStatus.textContent =
        `No jobs found within ${selectedDistance} miles. ` +
        `Try selecting a larger distance.`;
    } else {
      filterStatus.textContent =
        `Showing ${visibleJobCount} of ${jobs.length} ` +
        `mapped jobs within ${selectedDistance} miles.`;
    }
  }

  locationButton.addEventListener("click", () => {
    locationButton.disabled = true;
    filterStatus.textContent = "Finding your location...";

    locationControl.trigger();
  });

  locationControl.on("geolocate", position => {
    userLocation = {
      latitude: position.coords.latitude,
      longitude: position.coords.longitude
    };

    locationButton.disabled = false;
    distanceFilter.disabled = false;
    showAllButton.disabled = false;

    filterJobsByDistance();
  });

  locationControl.on("error", error => {
    locationButton.disabled = false;

    filterStatus.textContent =
      error.code === 1
        ? "Location access denied. Please enable location permissions."
        : "Unable to retrieve your location. Please try again.";
  });

  distanceFilter.addEventListener("change", () => {
    filterJobsByDistance();
  });

  showAllButton.addEventListener("click", () => {
    distanceFilter.value = "all";
    filterJobsByDistance();
  });


</script>
{% endblock content %}
